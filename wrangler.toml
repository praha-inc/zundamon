name = "zundamon"
main = "src/index.ts"
compatibility_date = "2023-11-24"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
queue = "zundamon"
binding = "QUEUE"

[[queues.consumers]]
queue = "zundamon"
max_batch_size = 1
# src/consumer/app-mention/index.tsのMAX_RETRIESと合わせる
max_retries = 3
