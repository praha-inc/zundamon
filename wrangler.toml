name = "zundamon"
main = "src/index.ts"
compatibility_date = "2023-11-24"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
queue = "zundamon"
binding = "QUEUE"

[[queues.consumers]]
queue = "zundamon"
max_batch_size = 1
max_retries = 3

[[vectorize]]
binding = "VECTORIZE_CONVERSATION"
index_name = "zundamon-conversation"
